name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes whatever is still running; there is no value in
# finishing a build whose output is already stale.
concurrency:
  group: build
  cancel-in-progress: true

env:
  BINUTILS_VERSION: "2.30"
  GDB_VERSION: "8.1"
  PKG_VERSION: "0.230.0"
  # Shared across all three hosts.
  #   --disable-readline --with-system-readline  works around a build failure in
  #                                              the bundled readline copy
  #   --without-python                           keeps libpython off the binary,
  #                                              which is what produced the
  #                                              "Could not find platform
  #                                              independent libraries" reports
  #   --disable-werror                           2018 sources vs modern compilers
  COMMON_CONFIGURE_FLAGS: >-
    --target=stm8-none-elf32
    --program-prefix=stm8-
    --disable-readline
    --with-system-readline
    --without-python
    --disable-werror

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            system: linux_x86_64
            branch: linux_x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            system: linux_aarch64
            branch: linux_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential texinfo bison flex file patch curl xz-utils \
            libreadline-dev libexpat1-dev zlib1g-dev libncurses-dev liblzma-dev

      - name: Download and patch sources
        run: ./ci/fetch_sources.sh

      - name: Stage static dependency archives
        run: |
          # gcc -dumpmachine resolves to x86_64-linux-gnu or aarch64-linux-gnu,
          # so the same step serves both runners.
          export SEARCH_DIRS="/usr/lib/$(gcc -dumpmachine) /usr/lib"
          STATICLIBS="$(pwd)/staticlibs"
          ./ci/stage_static_libs.sh "$STATICLIBS" \
            readline history ncurses ncursesw tinfo expat lzma z
          # gdb's configure settles on -lcurses, and Debian ships no
          # libcurses.a - only a libcurses.so symlink, which is how
          # libncurses.so.6 kept reappearing. Debian also splits terminfo out
          # into libtinfo, so a static libcurses.a has to carry both halves or
          # the link leaves tgetent and friends undefined.
          printf 'CREATE %s/libcurses.a\nADDLIB %s/libncurses.a\nADDLIB %s/libtinfo.a\nSAVE\nEND\n' \
            "$STATICLIBS" "$STATICLIBS" "$STATICLIBS" | ar -M
          ar t "$STATICLIBS/libcurses.a" | wc -l | xargs echo "libcurses.a members:"

      - name: Configure
        run: |
          PREFIX="$(pwd)/installed"
          STATICLIBS="$(pwd)/staticlibs"
          cd "binutils-${BINUTILS_VERSION}"
          # staticlibs holds only .a archives, and comes first in the library
          # search path, so -lreadline and friends resolve to the archives and
          # get linked into the binary. glibc is not in there and stays dynamic.
          ./configure --prefix="$PREFIX" $COMMON_CONFIGURE_FLAGS \
            LDFLAGS="-L${STATICLIBS}"

      - name: Build
        run: make -C "binutils-${BINUTILS_VERSION}" -j"$(nproc)"

      - name: Install
        run: make -C "binutils-${BINUTILS_VERSION}" install

      - name: Strip binaries
        run: ./ci/strip_tree.sh installed

      - name: Smoke test
        run: |
          ./installed/bin/stm8-gdb --version
          ./installed/bin/stm8-as --version
          ./installed/bin/stm8-ld --version
          ./ci/check_standalone.sh ./installed/bin/stm8-gdb
          echo "--- highest glibc symbol version required ---"
          objdump -T ./installed/bin/stm8-gdb \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Write package.json
        run: ./ci/make_package_json.sh ${{ matrix.system }} installed

      - uses: actions/upload-artifact@v4
        with:
          name: tool-stm8binutils-${{ matrix.system }}
          path: installed/

      - name: Publish to ${{ matrix.branch }} branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: >-
            binutils ${{ env.BINUTILS_VERSION }} + gdb ${{ env.GDB_VERSION }}
            for ${{ matrix.system }} (${{ github.sha }})
        run: ./ci/publish_branch.sh ${{ matrix.branch }} installed

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git patch tar xz texinfo bison flex file diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ncurses

      - name: Download and patch sources
        run: ./ci/fetch_sources.sh

      - name: Configure
        run: |
          PREFIX="$(pwd)/installed"
          cd "binutils-${BINUTILS_VERSION}"
          # MSYS2 ships GCC 16, which defaults to C23 - and in C23 an empty
          # parameter list means "no parameters" rather than "unprototyped".
          # The bundled gettext declares `char *getcwd();` the old way, so it
          # collides with mingw's real prototype. Pin the standards these 2018
          # sources were written against. C++17 likewise removed constructs gdb
          # 8.1 still uses.
          #
          # NCURSES_STATIC/READLINE_STATIC switch those headers out of their
          # default __declspec(dllimport) mode. Without them the TUI code links
          # against __imp_endwin, __imp_stdscr and friends, which do not exist
          # in a static build.
          #
          # -static so the result has no dependency on the MSYS2 runtime DLLs.
          ./configure \
            --build=x86_64-w64-mingw32 \
            --host=x86_64-w64-mingw32 \
            --prefix="$PREFIX" \
            $COMMON_CONFIGURE_FLAGS \
            CFLAGS="-std=gnu17 -g -O2 -DNCURSES_STATIC -DREADLINE_STATIC" \
            CXXFLAGS="-std=gnu++14 -g -O2 -DNCURSES_STATIC -DREADLINE_STATIC" \
            LDFLAGS=-static

      - name: Build
        run: make -C "binutils-${BINUTILS_VERSION}" -j"$(nproc)"

      - name: Install
        run: make -C "binutils-${BINUTILS_VERSION}" install

      - name: Strip binaries
        run: ./ci/strip_tree.sh installed

      - name: Smoke test
        run: |
          ./installed/bin/stm8-gdb.exe --version
          ./installed/bin/stm8-as.exe --version
          ./installed/bin/stm8-ld.exe --version
          ./ci/check_standalone.sh ./installed/bin/stm8-gdb.exe

      - name: Write package.json
        run: ./ci/make_package_json.sh windows_amd64 installed

      - uses: actions/upload-artifact@v4
        with:
          name: tool-stm8binutils-windows_amd64
          path: installed/

      - name: Publish to windows_x64 branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: >-
            binutils ${{ env.BINUTILS_VERSION }} + gdb ${{ env.GDB_VERSION }}
            for windows_amd64 (${{ github.sha }})
        run: ./ci/publish_branch.sh windows_x64 installed

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      # Without this the binaries are tagged with the runner's own OS version
      # and refuse to launch on anything older. 11.0 is the first macOS that
      # ran on Apple Silicon; 10.13 covers essentially every living Intel Mac.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            host: aarch64-apple-darwin
            system: darwin_arm64
            branch: mac_arm64
            deployment_target: "11.0"
          - arch: x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
            system: darwin_x86_64
            branch: mac_x64
            deployment_target: "10.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install texinfo expat readline

      - name: Download and patch sources
        run: ./ci/fetch_sources.sh

      # Both architectures need this: the intl/VERSION removal is about the
      # case-insensitive filesystem, which is not specific to Apple Silicon.
      - name: Prepare sources for macOS
        run: ./ci/macos_prep.sh

      - name: Stage static dependency archives
        run: |
          BREW="$(brew --prefix)"
          export SEARCH_DIRS="${BREW}/opt/readline/lib ${BREW}/opt/expat/lib ${BREW}/lib"
          # ncurses is not staged: macOS always ships libncurses in /usr/lib, so
          # linking it dynamically costs the user nothing.
          ./ci/stage_static_libs.sh "$(pwd)/staticlibs" readline history expat

      - name: Configure
        run: |
          PREFIX="$(pwd)/installed"
          STATICLIBS="$(pwd)/staticlibs"
          BREW="$(brew --prefix)"
          # Apple clang 15+ rejects the implicit declarations and implicit ints
          # that this 2018 C code is full of.
          export CFLAGS="-std=gnu17 -g -O2 -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-error"
          # -Wenum-constexpr-conversion is an error by default in clang 15+, not
          # a warning, so --disable-werror cannot reach it. gdb's enum_flags
          # casts -1 to an enum type all over, which the diagnostic rejects.
          export CXXFLAGS="-std=gnu++14 -g -O2 -Wno-error -Wno-enum-constexpr-conversion"
          # macOS "system readline" is libedit, which gdb cannot use, so point at
          # the keg-only homebrew readline instead.
          export CPPFLAGS="-I${BREW}/opt/readline/include -I${BREW}/opt/expat/include"
          # staticlibs holds only .a archives and comes first, so readline and
          # expat get linked in rather than leaving the binary pointing at
          # homebrew dylibs that a user's Mac will not have.
          export LDFLAGS="-L${STATICLIBS}"
          export PATH="${BREW}/opt/texinfo/bin:$PATH"
          cd "binutils-${BINUTILS_VERSION}"
          # --with-system-zlib: the bundled zlib's zutil.h does
          #   #define fdopen(fd,mode) NULL
          # under TARGET_OS_MAC, which Apple's headers define, and that macro
          # then mangles the SDK's own fdopen declaration. macOS ships libz in
          # /usr/lib, so use it and skip the 1990s copy entirely.
          ./configure \
            --build=${{ matrix.host }} \
            --host=${{ matrix.host }} \
            --prefix="$PREFIX" \
            --with-system-zlib \
            $COMMON_CONFIGURE_FLAGS

      - name: Build
        run: |
          export PATH="$(brew --prefix)/opt/texinfo/bin:$PATH"
          make -C "binutils-${BINUTILS_VERSION}" -j"$(sysctl -n hw.ncpu)"

      - name: Install
        run: make -C "binutils-${BINUTILS_VERSION}" install

      - name: Strip binaries
        run: ./ci/strip_tree.sh installed

      - name: Smoke test
        run: |
          ./installed/bin/stm8-gdb --version
          ./installed/bin/stm8-as --version
          ./installed/bin/stm8-ld --version
          echo "--- architecture ---"
          file ./installed/bin/stm8-gdb
          ./ci/check_standalone.sh ./installed/bin/stm8-gdb
          echo "--- signature ---"
          codesign -dv ./installed/bin/stm8-gdb

      - name: Write package.json
        run: ./ci/make_package_json.sh ${{ matrix.system }} installed

      - uses: actions/upload-artifact@v4
        with:
          name: tool-stm8binutils-${{ matrix.system }}
          path: installed/

      - name: Publish to ${{ matrix.branch }} branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: >-
            binutils ${{ env.BINUTILS_VERSION }} + gdb ${{ env.GDB_VERSION }}
            for ${{ matrix.system }} (${{ github.sha }})
        run: ./ci/publish_branch.sh ${{ matrix.branch }} installed

  linux-armv7l:
    name: Linux armv7l
    runs-on: ubuntu-latest
    # debian:11 rather than the ubuntu-22.04 runner so the armhf libraries come
    # from bullseye and the result needs only glibc 2.31 - matching the armv6
    # build, and covering Raspberry Pi OS bullseye, which a large share of
    # deployed Pis still run. Building on the runner directly would demand 2.35.
    container: debian:11
    env:
      CROSS_HOST: arm-linux-gnueabihf
    steps:
      - name: Install build dependencies
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential crossbuild-essential-armhf qemu-user-static \
            texinfo bison flex file patch curl xz-utils ca-certificates git make \
            libreadline-dev:armhf libexpat1-dev:armhf zlib1g-dev:armhf \
            libncurses-dev:armhf liblzma-dev:armhf
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Download and patch sources
        run: ./ci/fetch_sources.sh

      - name: Stage static dependency archives
        run: |
          export SEARCH_DIRS="/usr/lib/${CROSS_HOST}"
          STATICLIBS="$(pwd)/staticlibs"
          ./ci/stage_static_libs.sh "$STATICLIBS" \
            readline history ncurses ncursesw tinfo expat lzma z
          # Same -lcurses problem as the native Linux build, and the cross ar so
          # the archive index is written for the target architecture.
          printf 'CREATE %s/libcurses.a\nADDLIB %s/libncurses.a\nADDLIB %s/libtinfo.a\nSAVE\nEND\n' \
            "$STATICLIBS" "$STATICLIBS" "$STATICLIBS" | "${CROSS_HOST}-ar" -M
          "${CROSS_HOST}-ar" t "$STATICLIBS/libcurses.a" | wc -l \
            | xargs echo "libcurses.a members:"

      - name: Configure
        run: |
          PREFIX="$(pwd)/installed"
          STATICLIBS="$(pwd)/staticlibs"
          cd "binutils-${BINUTILS_VERSION}"
          ./configure \
            --build=x86_64-pc-linux-gnu \
            --host="${CROSS_HOST}" \
            --prefix="$PREFIX" \
            $COMMON_CONFIGURE_FLAGS \
            LDFLAGS="-L${STATICLIBS}"

      - name: Build
        run: make -C "binutils-${BINUTILS_VERSION}" -j"$(nproc)"

      - name: Install
        run: make -C "binutils-${BINUTILS_VERSION}" install

      - name: Strip binaries
        env:
          STRIP: arm-linux-gnueabihf-strip
        run: ./ci/strip_tree.sh installed

      - name: Smoke test
        run: |
          echo "--- architecture ---"
          file ./installed/bin/stm8-gdb
          # The binaries are armv7 and the host is x86_64, so run them under
          # qemu. The armhf multiarch loader and libraries are already present.
          qemu-arm-static ./installed/bin/stm8-gdb --version
          qemu-arm-static ./installed/bin/stm8-as --version
          qemu-arm-static ./installed/bin/stm8-ld --version
          ./ci/check_standalone.sh ./installed/bin/stm8-gdb
          echo "--- highest glibc symbol version required ---"
          objdump -T ./installed/bin/stm8-gdb \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Write package.json
        run: ./ci/make_package_json.sh linux_armv7l installed

      - uses: actions/upload-artifact@v4
        with:
          name: tool-stm8binutils-linux_armv7l
          path: installed/

      - name: Publish to linux_armv7l branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: >-
            binutils ${{ env.BINUTILS_VERSION }} + gdb ${{ env.GDB_VERSION }}
            for linux_armv7l (${{ github.sha }})
        run: ./ci/publish_branch.sh linux_armv7l installed

  linux-armv6l:
    name: Linux armv6l
    runs-on: ubuntu-22.04
    # Emulated, so far slower than every other job here. ARMv6 has no native
    # runner and Debian/Ubuntu armhf is ARMv7-baseline, which would not run on a
    # Pi 1 or Zero at all - Raspberry Pi OS 32-bit is the only practical source
    # of genuine ARMv6 libraries.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Build inside emulated Raspberry Pi OS
        uses: pguyot/arm-runner-action@v2
        with:
          # 2021-10-30 is the first bullseye release: glibc 2.31.
          base_image: raspios_lite:2021-10-30
          cpu: arm1176
          image_additional_mb: 8000
          copy_artifact_path: installed
          commands: |
            set -e
            # These are interpolated into the script before it enters the image.
            # If that ever stops working the flags would silently vanish and we
            # would build a host-targeted gdb, so check rather than assume.
            CONFIGURE_FLAGS="${{ env.COMMON_CONFIGURE_FLAGS }}"
            case "$CONFIGURE_FLAGS" in
              *--target=stm8-none-elf32*) ;;
              *) echo "configure flags failed to expand: '$CONFIGURE_FLAGS'" >&2; exit 1 ;;
            esac
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential texinfo bison flex file patch curl xz-utils \
              ca-certificates binutils \
              libreadline-dev libexpat1-dev zlib1g-dev libncurses-dev liblzma-dev
            ./ci/fetch_sources.sh
            export SEARCH_DIRS="/usr/lib/arm-linux-gnueabihf /usr/lib"
            STATICLIBS="$(pwd)/staticlibs"
            ./ci/stage_static_libs.sh "$STATICLIBS" \
              readline history ncurses ncursesw tinfo expat lzma z
            printf 'CREATE %s/libcurses.a\nADDLIB %s/libncurses.a\nADDLIB %s/libtinfo.a\nSAVE\nEND\n' \
              "$STATICLIBS" "$STATICLIBS" "$STATICLIBS" | ar -M
            PREFIX="$(pwd)/installed"
            cd "binutils-${{ env.BINUTILS_VERSION }}"
            ./configure --prefix="$PREFIX" $CONFIGURE_FLAGS \
              LDFLAGS="-L$STATICLIBS"
            make -j"$(nproc)"
            make install
            cd ..
            ./ci/strip_tree.sh installed
            ./installed/bin/stm8-gdb --version
            ./installed/bin/stm8-as --version
            ./ci/check_standalone.sh ./installed/bin/stm8-gdb

      - name: Write package.json
        run: ./ci/make_package_json.sh linux_armv6l installed

      - name: Verify architecture
        run: |
          file ./installed/bin/stm8-gdb
          readelf -A ./installed/bin/stm8-gdb | grep -iE 'Tag_CPU_(name|arch)' || true

      - uses: actions/upload-artifact@v4
        with:
          name: tool-stm8binutils-linux_armv6l
          path: installed/

      - name: Publish to linux_armv6l branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: >-
            binutils ${{ env.BINUTILS_VERSION }} + gdb ${{ env.GDB_VERSION }}
            for linux_armv6l (${{ github.sha }})
        run: ./ci/publish_branch.sh linux_armv6l installed
